[project]
name = "lablens"
version = "0.1.0"
description = "Scientific Metadata Extraction Pipeline - Extract structured experimental metadata from scientific publications using NLP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Akash"},
]
keywords = ["scientific", "metadata", "extraction", "NLP", "NER", "spacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
]

dependencies = [
    "spacy>=3.7,<4.0",
    "streamlit>=1.30,<2.0",
    "pandas>=2.1,<3.0",
    "pdfplumber>=0.11,<1.0",
    "regex>=2024.1",
    "scikit-learn>=1.4,<2.0",
]

[project.scripts]
lablens = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
